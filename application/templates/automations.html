{% extends "base.html" %}

{% block component_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/Overlay.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/MultiStepModalForm.css') }}">
{% endblock %}

{% block content %}
<script id="pageData" type="application/json">{{ dict(automations=automations, devices=devices, groups=groups, actions=actions, modes=modes, models=DEVICE_MODELS) | tojson }}</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles_tiles.css') }}">
<link rel="stylesheet" media="screen and (max-width: 699px)" href="{{ url_for('static', filename='css/styles_tiles_mobile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles_device_catalog.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles_automation_modal.css') }}">


<div data-ref="automation-editor"></div>
<div id="automationContainer" class="flex-grid"></div>
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/automations_page.js') }}"></script>
{% endblock %}
