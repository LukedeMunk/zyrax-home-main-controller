<!DOCTYPE html>
<html>
    <head>
        <!-- ZyraX Home -->
        <!-- Written and generated by Luke de Munk -->
        <!-- Munk IT -->
        <!-- Version: 0.10.0 -->
        <!-- Template version: 0.1.0 -->
        <title id="title">{{ title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/variables.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/global.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/ModalForm.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/StandardTable.css') }}">
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
        <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
        <link href="{{ url_for('static', filename='fontawesome-icons/css/all.min.css') }}" rel="stylesheet">
        <meta charset="utf-8"/>

        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/BannerManager.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/PopupManager.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/FloatingNavigationBar.css') }}">

        {% block component_styles %}{% endblock %}

        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="stylesheet" media="screen and (max-width: 699px)" href="{{ url_for('static', filename='css/styles_mobile.css') }}">
        {% block head %}{% endblock %}
        
        {% block page_styles %}{% endblock %}
    </head>


    <body class="{% block body_class %}{% endblock %}">
        <div id="shellData" hidden data-version="{{ CURRENT_APPLICATION_VERSION }}" data-alarm="{{ 'true' if alarm_activated in (true, 'True') else 'false' }}"></div>
        <div data-ref="notifications"></div>
        <div data-ref="confirmations"></div>
        <div data-ref="main-navigation"></div>
        <div class="">
            {% block page_title %}<h2>{{ title }}</h2>{% endblock %}
            {% block content %}

            {% endblock %}
        </div>
        
        {% block page_scripts %}{% endblock %}
    </body>
</html>
