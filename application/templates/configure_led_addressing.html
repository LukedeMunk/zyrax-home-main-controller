{% extends "base.html" %}

{% block component_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/MouseContextMenu.css') }}">
{% endblock %}

{% block content %}
<script id="pageData" type="application/json">{{ dict(strip=ledstrip) | tojson }}</script>

<div data-ref="led-menu"></div>
<div class="container-form">
    <div class="base-container">
        <div id="toolbarContainer" style="display: flex; justify-content: space-between;">
            <p id="instructionMessageField" class="message" style="margin-top: 0px; display: block;"></p>

            <div class="input-field-container" style="width: 10%;">
                <p id="addressTitle" class="input-field-title gradient-background">Address</p>
                <input id="addressTxt" type="text" class="input-field" value="0"/>
            </div>

            <div class="button-message" data-action="toggleSegmentType">
                <i id="drawingElementIcon" class=""></i>
                <p id="drawingElementField" style="margin: 0px;"></p>
            </div>
        </div>
        <div style="display: flex; gap: 20px;">
            <canvas id="ledCanvas" class="ledstrip-addressing-canvas" width="800" height="600"></canvas>
            <div>
                <button id="clearBtn" data-action="resetAll">Clear</button>
                <button id="resetBtn" data-action="loadCurrent">Reset</button>
                <button id="resetAddressingBtn" data-action="resetAddressing">Reset addressing</button>
                <button id="saveBtn" data-action="save" style="margin-top: 40px;">Save</button>
                <button id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/configure_led_addressing_page.js') }}"></script>
{% endblock %}
