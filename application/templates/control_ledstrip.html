{% extends "base.html" %}

{% block component_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/templates/css/ui_components/Overlay.css') }}">
{% endblock %}

{% block content %}
<div data-ref="mode-dialogs"></div>
<div data-ref="loading"></div>
<div data-ref="ledstrip-settings"></div>

<script id="pageData" type="application/json">{{ dict(stripOrGroup=(group if group_selected else ledstrip), groupSelected=group_selected, devices=devices|default([]), ledstripOrGroupId=id, modeConfigurations=mode_configurations, palettes=palettes, powerAnimations=power_animations, LEDSTRIP_MODES=LEDSTRIP_MODES) | tojson }}</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles_tiles.css') }}">
<link rel="stylesheet" media="screen and (max-width: 699px)" href="{{ url_for('static', filename='css/styles_tiles_mobile.css') }}">

<div class="container-form">
    <div class="base-container">
        <p id="ledstripMessageField" class="message warning" style="margin-top: 0px;"></p>
        <fieldset class="flex" style="margin-top: 0px; flex-direction: column;">
            <legend id="basicsTitle">Basics</legend>
            <div style="display: flex; align-items: flex-end; margin: 0px auto; gap: 10px">
                <label class="switch" style="margin: 0px;">
                    <input id="powerCb" type="checkbox" data-action="setPower">
                    <span class="slider round"></span>
                </label>

                <div class="input-field-container" style="min-width: unset; margin: 0px;">
                    <p id="colorTitle" class="input-field-title gradient-background">Color</p>
                    <input id="colorColor" type="color" class="input-field"/>
                </div>
            </div>

            <div class="input-field-container">
                <p id="brightnessTitle" class="range-title" style="background-color: transparent;">Brightness</p>
                <div data-brightness-field></div>
            </div>
        </fieldset>
    </div>
</div>

<div class="container-form">
    <div class="base-container">
        <h3 id="selectModeTitle" style="margin-top: 0px;">Select mode</h3>

        <div id="modeButtonContainer" class="flex-grid" style="justify-content: center;"></div>
    </div>
</div>

<div class="container-form">
    <div class="base-container">
        <h3 id="powerAnimationTitle" style="margin-top: 0px;"></h3>
        <div id="powerAnimationContainer" class="flex-grid" role="group" aria-labelledby="powerAnimationTitle" style="justify-content: center;"></div>
    </div>
</div>

{% if not group_selected %}
<div class="container-form">
    <div class="base-container">
        <div class="ledstrip-actions" data-ref="ledstrip-actions"></div>
    </div>
</div>
{% endif %}
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/control_ledstrip_page.js') }}"></script>
{% endblock %}
