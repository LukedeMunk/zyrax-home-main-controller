{% extends "base.html" %}

{% block content %}
<script id="pageData" type="application/json">{{ dict(message=message, profiles=user_profiles) | tojson }}</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles_welcome_screen.css') }}">

<div id="welcomeContainer" class="container-form" style="height: 100vh;">
    <div class="welcome-container">
        <div id="welcomePicture" class="welcome-logo"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="ZyraX Logo"></div>
        <div id="welcomeTitle" class="welcome-title-container" style="margin-top: 32px;"></div>
        <div class="fade-button" style="animation: buttonFadeIn 1s ease 1.2s forwards;"><button class="welcome-action" id="welcomeBtn">Login</button></div>
    </div>
</div>

<div id="loginContainer" class="container-form full-width" style="min-height: 100vh; width: 50%; margin: auto;">
    <div class="base-container">
        <p id="messageField" class="message" style="margin: 0px;"></p>

        <div>
            <input id="emailTxt" type="email" placeholder="Email" required>
            <i id="rememberEmailIcon" class="fas fa-floppy-disk clickable" style="margin-left: 5px;"></i>
        </div>

        <div>
            <input id="passwordTxt" type="password" placeholder="Password" required>
            <i id="showPasswordIcon" class="fas fa-eye clickable" style="margin-left: 5px;"></i>
        </div>
        <div style="display: flex; justify-content: center;">
            <button class="welcome-action" id="loginBtn">Login</button>
        </div>
    </div>
</div>

<div id="profileContainer" class="container-form" style="min-height: 100vh; width: 50%; margin: auto;">
    <div id="profileSelectContainer" style="display: flex; gap: 30px; flex-wrap: wrap; justify-content: center;"></div>
</div>

<div id="emptyContainer" class="container-form" style="min-height: 100vh; width: 50%; margin: auto;">
    <div id="personalWelcomeTitle" class="welcome-title-container" style="margin-top: 32px;"></div>
</div>
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/login_page.js') }}"></script>
{% endblock %}
