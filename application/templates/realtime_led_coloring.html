{% extends "base.html" %}

{% block content %}
<script id="pageData" type="application/json">{{ dict(strip=ledstrip) | tojson }}</script>

<div id="segmentMouseMenu" class="mouse-context-menu">
    <ul class="mouse-context-menu-options">
        <li class="mouse-context-menu-option">
            <div style="display: flex; align-items: baseline;" data-action="colorSegment">
                <i class="fa-solid fa-list-ol margin-r-5px"></i>
                <p id="colorSegmentTitle">Color segment</p>
            </div>
        </li>
    </ul>
</div>

<div class="container-form">
    <div class="base-container">
        <canvas id="ledCanvas" class=""></canvas>

        <fieldset>
            <legend id="drawingToolsTitle">Drawing tools</legend>
            <div style="text-align: center;">
                <div class="input-field-container color-container">
                    <p id="colorTitle" id="colorTitle" class="input-field-title gradient-background" style="text-align: center; margin: 0px auto;">Color</p>
                    <input id="colorColor" type="color" class="input-field" data-action="setPencilColor"/>
                </div>
                <div>
                    <input id="colorGradientCb" type="checkbox" data-action="setGradient">
                    <p id="colorGradientCbTitle">Use gradient</p>
                </div>

                <button id="colorAllBtn" data-action="colorAll">Color all</button>
                <button id="clearColorsBtn" data-action="clearColors">Clear</button>
            </div>
        </fieldset>

        <fieldset>
            <legend id="animationModesTitle">Animation modes</legend>
            <div style="text-align: center;">
                <button class="button-selected">No animation</button>
                <button>Propagate animation</button>
            </div>
        </fieldset>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/realtime_led_coloring_page.js') }}"></script>
{% endblock %}
