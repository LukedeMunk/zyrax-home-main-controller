{% extends "base.html" %}

{% block content %}
<script id="pageData" type="application/json">{{ dict(devices=devices, sensorTriggerTimes=sensor_trigger_times) | tojson }}</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/styles_tiles.css') }}">

<div data-ref="loading"></div>
<div class="container-form">
    <div class="base-container">
        <div id="stateContainer" class="flex"></div>
    </div>
</div>

<div class="container-form">
    <div class="base-container">
        <table class="scrollable-table-container-table">
            <tr>
                <td class="scrollable-td">
                    <table id="triggerTableHeader" class="scrollable-table-header"></table>
                </td>
            </tr>
            <tr>
                <td class="scrollable-td">
                    <div class="scrollable-table-container">
                        <table id="triggerTable" class="scrollable-table" style="table-layout: fixed;"></table>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/rf_devices_page.js') }}"></script>
{% endblock %}
